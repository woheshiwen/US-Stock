# Cursor Cloud Agent 把 reports/*.md push 到 main 后，自动发邮件
name: Email US Market Daily Report

on:
  push:
    branches: [main]
    paths:
      - "reports/**.md"

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Detect changed report files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD | grep '^reports/.*\.md$' || true)
          if [ -z "$FILES" ]; then
            echo "No report md in this push."
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_report=true" >> "$GITHUB_OUTPUT"
          # Use the last file if multiple
          LAST=$(echo "$FILES" | tail -1)
          echo "report_file=$LAST" >> "$GITHUB_OUTPUT"
          echo "Will email: $LAST"

      - name: Send email via Resend
        if: steps.changed.outputs.has_report == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_GITHUB_BLOB_URL: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/${{ steps.changed.outputs.report_file }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$REPORT_EMAIL_TO" ]; then
            echo "::warning::RESEND_API_KEY or REPORT_EMAIL_TO not configured — skip email."
            exit 0
          fi
          python3 scripts/send_report_email.py --file "${{ steps.changed.outputs.report_file }}"
