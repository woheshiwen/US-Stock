name: US Market Daily Report

on:
  schedule:
    - cron: "0 8 * * 2-6"
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      session_date:
        description: "NYSE session date (YYYY-MM-DD), empty = last session"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: us-market-daily
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate full daily report (Cursor parity)
        env:
          SESSION_DATE: ${{ github.event.inputs.session_date }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o' }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          export PYTHONPATH=scripts
          if [ -n "$SESSION_DATE" ]; then
            python3 scripts/generate_full_daily_report.py --date "$SESSION_DATE"
          else
            python3 scripts/generate_full_daily_report.py
          fi

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet reports/; then
            echo "No report changes to commit."
            exit 0
          fi
          git add reports/
          git commit -m "chore(reports): full US market daily report $(date -u +%Y-%m-%d)"
          git push
