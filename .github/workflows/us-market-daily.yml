# 默认请用 Cursor Cloud Agent 生成完整日报，见 docs/CURSOR_CLOUD_AGENT_SETUP.zh.md
# 本 workflow 仅保留：可选的数据抓取（无需 OpenAI Key），不自动生成简版/LLM 报告。

name: US Market Daily (optional data fetch)

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: "NYSE session date (YYYY-MM-DD), empty = last session"
        required: false
        type: string

permissions:
  contents: write

jobs:
  fetch-data-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch market data JSON (optional helper for Cloud Agent)
        env:
          SESSION_DATE: ${{ github.event.inputs.session_date }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          mkdir -p data
          if [ -n "$SESSION_DATE" ]; then
            python3 scripts/fetch_market_data.py --date "$SESSION_DATE" --out "data/${SESSION_DATE}.json"
          else
            python3 scripts/fetch_market_data.py --out data/latest.json
          fi

      - name: Commit data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore(data): market snapshot $(date -u +%Y-%m-%d)"
          git push
