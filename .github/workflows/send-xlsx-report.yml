name: Send XLSX Report Email

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/send-xlsx-report.yml'
      - 'reports/2014年前项目全量报表.xlsx'

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Send Excel report email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
        run: |
          python scripts/send_xlsx_email.py \
            --file "reports/2014年前项目全量报表.xlsx" \
            --subject "2014年前项目全量报表"
